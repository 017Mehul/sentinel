name: CI

on:
  push:
    branches: [main, master, release-hardening]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache: false
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Tidy and download dependencies
        run: |
          go mod tidy
          go mod download
          go mod verify
          git diff --exit-code -- go.mod go.sum
      - name: Build all binaries
        run: |
          go build -trimpath -ldflags="-s -w" ./cmd/server
          go build -trimpath -ldflags="-s -w" ./cmd/worker
      - name: Set up Node.js for frontend checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate web console JavaScript
        run: |
          node --check web/app.js
          node --check web/api-docs.js
          node --check web/build-config.mjs
          node --check web/tests/connected-screenshot.mjs
          (cd web && SENTINEL_API_BASE=https://api.example.com node build-config.mjs)
          test -f web/dist/index.html
          grep -q "SENTINEL_ALLOW_API_URL_OVERRIDE = false" web/dist/config.js
      - name: Run vet
        run: go vet ./...
      - name: Run unit tests
        run: go test -race -count=1 -timeout=120s ./...
      - name: Run security checks
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          gosec ./...
          govulncheck ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache: false
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Tidy dependencies
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0
          args: --timeout=5m

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache: false
      - name: Generate coverage
        run: |
          go test -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | tee coverage-summary.txt
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-coverage
          path: |
            coverage.out
            coverage-summary.txt
          if-no-files-found: error

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache: false
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Tidy dependencies
        run: go mod tidy
      - name: Run integration tests (Testcontainers)
        run: go test -race -count=1 -timeout=300s -tags=integration ./tests/integration/...
        env:
          TESTCONTAINERS_RYUK_DISABLED: "false"

  container:
    name: Container Build & Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config --quiet
          printf 'dummy private key' > /tmp/sentinel-jwt-private.pem
          printf 'dummy public key' > /tmp/sentinel-jwt-public.pem
          cat > /tmp/sentinel-production.env <<'EOF'
          DB_HOST=db.example.com
          DB_NAME=sentinel
          DB_USER=sentinel
          DB_PASSWORD=database-secret-value-123456
          REDIS_ADDR=redis.example.com:6379
          REDIS_PASSWORD=redis-secret-value-123456
          JWT_CURRENT_KEY_ID=sentinel-ci-key
          AES_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef
          OAUTH_STATE_SECRET=oauth-state-secret-with-at-least-32-bytes
          OAUTH_GOOGLE_REDIRECT_URL=https://api.example.com/api/v1/oauth/google/callback
          OAUTH_GITHUB_REDIRECT_URL=https://api.example.com/api/v1/oauth/github/callback
          SMTP_HOST=smtp.example.com
          SMTP_USERNAME=ci-user
          SMTP_PASSWORD=ci-password
          SMTP_FROM_EMAIL=sentinel@example.net
          CORS_ALLOWED_ORIGINS=https://console.example.com
          JWT_PRIVATE_KEY_FILE=/tmp/sentinel-jwt-private.pem
          JWT_PUBLIC_KEY_FILE=/tmp/sentinel-jwt-public.pem
          EOF
          docker compose -f docker-compose.production.yml --env-file /tmp/sentinel-production.env config --quiet
      - name: Build production image
        run: docker build --pull --tag sentinel:ci .
      - name: Scan production image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sentinel:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
