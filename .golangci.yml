version: "2"
run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    cyclop:
      max-complexity: 15
    gocognit:
      min-complexity: 20
  exclusions:
    rules:
      - path: "_test\\.go"
        linters:
          - bodyclose
      - path: "wire_gen\\.go"
        linters:
          - all
      - path: "migrations/"
        linters:
          - all

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
