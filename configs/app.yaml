app:
  name: ${APP_NAME:auth-service}
  env: ${APP_ENV:development}
  version: ${APP_VERSION:1.0.0}
  port: ${APP_PORT:8080}
  grpc_port: ${GRPC_PORT:9090}
  shutdown_timeout: ${SHUTDOWN_TIMEOUT:30s}

database:
  host: ${DB_HOST:localhost}
  port: ${DB_PORT:5432}
  name: ${DB_NAME:authdb}
  user: ${DB_USER:postgres}
  password: ${DB_PASSWORD:changeme}
  ssl_mode: ${DB_SSL_MODE:disable}
  max_open_conns: ${DB_MAX_OPEN_CONNS:25}
  max_idle_conns: ${DB_MAX_IDLE_CONNS:5}
  conn_max_lifetime: ${DB_CONN_MAX_LIFETIME:5m}
  conn_max_idle_time: ${DB_CONN_MAX_IDLE_TIME:5m}

redis:
  addr: ${REDIS_ADDR:localhost:6379}
  password: ${REDIS_PASSWORD:}
  db: ${REDIS_DB:0}
  pool_size: ${REDIS_POOL_SIZE:10}
  min_idle_conns: ${REDIS_MIN_IDLE_CONNS:5}
  dial_timeout: ${REDIS_DIAL_TIMEOUT:5s}
  read_timeout: ${REDIS_READ_TIMEOUT:3s}
  write_timeout: ${REDIS_WRITE_TIMEOUT:3s}

jwt:
  private_key_path: ${JWT_PRIVATE_KEY_PATH:./certs/private.pem}
  public_key_path: ${JWT_PUBLIC_KEY_PATH:./certs/public.pem}
  access_token_ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
  refresh_token_ttl: ${JWT_REFRESH_TOKEN_TTL:720h}
  issuer: ${JWT_ISSUER:auth-service}
  audience: ${JWT_AUDIENCE:api}

secrets:
  provider: ${SECRET_PROVIDER:local}
  vault:
    addr: ${VAULT_ADDR:http://localhost:8200}
    token: ${VAULT_TOKEN:}
    mount_path: ${VAULT_MOUNT_PATH:secret}
  aws:
    region: ${AWS_REGION:us-east-1}
    secret_prefix: ${AWS_SECRET_PREFIX:auth-service/}

nats:
  url: ${NATS_URL:nats://localhost:4222}
  stream_name: ${NATS_STREAM_NAME:AUTH}
  stream_subjects: ${NATS_STREAM_SUBJECTS:auth.>}
  consumer_name: ${NATS_CONSUMER_NAME:auth-consumer}

smtp:
  host: ${SMTP_HOST:localhost}
  port: ${SMTP_PORT:1025}
  username: ${SMTP_USERNAME:}
  password: ${SMTP_PASSWORD:}
  from_name: ${SMTP_FROM_NAME:Auth Service}
  from_email: ${SMTP_FROM_EMAIL:noreply@example.com}
  tls_enabled: ${SMTP_TLS_ENABLED:false}

oauth:
  state_secret: ${OAUTH_STATE_SECRET:changeme}
  google:
    client_id: ${OAUTH_GOOGLE_CLIENT_ID:}
    client_secret: ${OAUTH_GOOGLE_CLIENT_SECRET:}
    redirect_url: ${OAUTH_GOOGLE_REDIRECT_URL:http://localhost:8080/api/v1/oauth/google/callback}
  github:
    client_id: ${OAUTH_GITHUB_CLIENT_ID:}
    client_secret: ${OAUTH_GITHUB_CLIENT_SECRET:}
    redirect_url: ${OAUTH_GITHUB_REDIRECT_URL:http://localhost:8080/api/v1/oauth/github/callback}

security:
  aes_encryption_key: ${AES_ENCRYPTION_KEY:changeme-32-byte-aes-key-here!!!}
  bcrypt_cost: ${BCRYPT_COST:12}
  account_lock_max_attempts: ${ACCOUNT_LOCK_MAX_ATTEMPTS:5}
  account_lock_duration: ${ACCOUNT_LOCK_DURATION:15m}
  password_reset_token_ttl: ${PASSWORD_RESET_TOKEN_TTL:1h}
  email_verification_token_ttl: ${EMAIL_VERIFICATION_TOKEN_TTL:24h}
  idempotency_key_ttl: ${IDEMPOTENCY_KEY_TTL:24h}
  replay_detect_window: ${REPLAY_DETECT_WINDOW:120s}
  mfa_otp_window: ${MFA_OTP_WINDOW:1}
  mfa_backup_code_count: ${MFA_BACKUP_CODE_COUNT:10}

rate_limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  auth_rpm: ${RATE_LIMIT_AUTH_RPM:5}
  general_rpm: ${RATE_LIMIT_GENERAL_RPM:100}
  window: ${RATE_LIMIT_WINDOW:60s}

cors:
  allowed_origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  allow_credentials: ${CORS_ALLOW_CREDENTIALS:true}

hibp:
  enabled: ${HIBP_ENABLED:true}
  api_timeout: ${HIBP_API_TIMEOUT:3s}

otel:
  enabled: ${OTEL_ENABLED:true}
  service_name: ${OTEL_SERVICE_NAME:auth-service}
  exporter_endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
  sample_ratio: ${OTEL_SAMPLE_RATIO:1.0}

features:
  file: ${FEATURE_FLAGS_FILE:./configs/feature_flags.yaml}
  reload_interval: ${FEATURE_FLAGS_RELOAD_INTERVAL:30s}

webhook:
  delivery_timeout: ${WEBHOOK_DELIVERY_TIMEOUT:10s}
  max_retries: ${WEBHOOK_MAX_RETRIES:5}

tls:
  enabled: ${TLS_ENABLED:false}
  cert_file: ${TLS_CERT_FILE:}
  key_file: ${TLS_KEY_FILE:}
