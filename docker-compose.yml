services:
  postgres:
    image: postgres:16-alpine
    container_name: auth-postgres
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d authdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: auth-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.50
    container_name: auth-jaeger
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317"   # OTLP gRPC receiver

  migrate:
    image: migrate/migrate:v4.18.1
    container_name: auth-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "postgres://postgres:changeme@postgres:5432/authdb?sslmode=disable", "up"]
    restart: "no"

  auth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      APP_ENV: development
      APP_NAME: auth-service
      APP_VERSION: 1.0.0
      APP_PORT: 8080
      GRPC_PORT: 9090
      SHUTDOWN_TIMEOUT: 30s
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: authdb
      DB_USER: postgres
      DB_PASSWORD: changeme
      DB_SSL_MODE: disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      JWT_PRIVATE_KEY_PATH: /app/certs/private.pem
      JWT_PUBLIC_KEY_PATH: /app/certs/public.pem
      JWT_ACCESS_TOKEN_TTL: 15m
      JWT_REFRESH_TOKEN_TTL: 720h
      JWT_ISSUER: auth-service
      JWT_AUDIENCE: api
      SECRET_PROVIDER: local
      AES_ENCRYPTION_KEY: changeme-32-byte-aes-key-here!!!
      BCRYPT_COST: 12
      ACCOUNT_LOCK_MAX_ATTEMPTS: 5
      ACCOUNT_LOCK_DURATION: 15m
      PASSWORD_RESET_TOKEN_TTL: 1h
      EMAIL_VERIFICATION_TOKEN_TTL: 24h
      MFA_BACKUP_CODE_COUNT: 10
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      CORS_ALLOW_CREDENTIALS: "true"
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: "auth-service"
      OTEL_EXPORTER_ENDPOINT: "jaeger:4317"
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_AUTH_RPM: 5
      RATE_LIMIT_GENERAL_RPM: 100
      RATE_LIMIT_WINDOW: 60s
      FEATURE_FLAGS_FILE: /app/configs/feature_flags.yaml
      FEATURE_FLAGS_RELOAD_INTERVAL: 30s
    volumes:
      - ./certs:/app/certs:ro

volumes:
  pgdata:
