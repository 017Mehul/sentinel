syntax = "proto3";

package auth.v1;

option go_package = "github.com/017Mehul/sentinel/proto/auth/v1;authv1";

service AuthService {
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse);
}

message ValidateTokenRequest { string token = 1; }
message ValidateTokenResponse { bool valid = 1; string user_id = 2; repeated string roles = 3; }
message GetUserRequest { string user_id = 1; }
message GetUserResponse { string user_id = 1; string email = 2; repeated string roles = 3; }
message CheckPermissionRequest { string user_id = 1; string resource = 2; string action = 3; }
message CheckPermissionResponse { bool allowed = 1; }
